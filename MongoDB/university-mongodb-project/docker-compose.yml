version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_university_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  app:
    build: .
    container_name: university_app
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=universityDB
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data: