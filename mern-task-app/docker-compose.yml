version: '3.8'

services:
  app:
    build: .
    container_name: mern_app
    restart: always
    ports:
      - "3000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/mern_task_db
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: mern_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: