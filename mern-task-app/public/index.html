<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERN Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Manager</h1>
      <p>Node.js, Express, MongoDB & Vanilla Frontend</p>
    </header>

    <form id="task-form">
      <input 
        type="text" 
        id="task-input" 
        placeholder="What needs to be done?" 
        required 
        autocomplete="off"
      >
      <button type="submit" id="submit-btn">Add Task</button>
    </form>

    <div class="task-container">
      <ul id="task-list">
        <!-- Tasks injected dynamically via app.js -->
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
